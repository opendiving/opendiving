name: Shell

# `install.sh` is the only executable thing in this repository, and it runs once, on
# somebody else's machine, before anything it installs exists. There is no fixture for "a
# fresh VPS with Docker, a domain and a mail relay", so a linter is the whole test suite it
# can have - which makes it worth running on every PR rather than only when the script
# changes.
#
# Not path-filtered on purpose, for the same reason `pr-title.yml` runs on `synchronize`: a
# required check has to have passed on the PR's latest head SHA, and a filtered workflow
# that skips leaves the PR waiting for a status that never arrives.
on:
  pull_request:
  push:
    branches: [main]

# Nothing is published and nothing is written back - the checkout is all this needs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ShellCheck ships in the GitHub-hosted runner image; the install is a fallback for
      # the day it stops. The same check locally, with no install at all:
      #
      #     docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable install.sh
      - name: Lint install.sh
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          shellcheck install.sh

      # Cheap, and it is bash's own parser rather than ShellCheck's reimplementation of it.
      - name: Parse install.sh with bash itself
        run: bash -n install.sh
